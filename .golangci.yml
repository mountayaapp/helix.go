version: "2"

linters:
  default: none
  enable:
    # govet is on by default in plain `go test`, and was the notable absence here:
    # copylocks, lostcancel and printf all catch real bugs.
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - unused

    # errorlint catches comparing errors with == instead of errors.Is, which
    # breaks the moment anything in the chain starts wrapping.
    - errorlint

    # nilerr catches returning nil after checking err != nil - the shape that
    # swallowed a Valkey transport failure.
    - nilerr

    # bodyclose catches an HTTP response body that is never closed, which leaks
    # the pooled connection under it.
    - bodyclose

    # modernize runs the analyzers behind `go fix`, so that code written against
    # an older Go — errors.As into a declared variable, a pointer helper where
    # new(expr) does, a hand-written loop over a map or a slice — fails here
    # rather than reaching review.
    - modernize

    # usetesting, usestdlibvars and exptostd point at what the standard library
    # already has: t.Context, t.TempDir and t.Setenv in tests, http.MethodGet
    # and its kin over literals, and the std package a golang.org/x/exp one
    # became.
    - usetesting
    - usestdlibvars
    - exptostd

    # testifylint catches an assertion whose failure says less than another's
    # would — assert.True(errors.Is(...)) over assert.ErrorIs — expected and
    # actual swapped, and require called off the test's goroutine.
    - testifylint
  settings:
    errcheck:
      # Builder-style methods on errorstack.Error, whose return value is the same
      # receiver. Named by their full receiver so that unrelated types with an
      # Append or SetExtension method still trip errcheck.
      exclude-functions:
        - (*github.com/mountaya/helix.go/errorstack.Error).Append
        - (*github.com/mountaya/helix.go/errorstack.Error).SetExtension

    testifylint:
      disable:
        # An error assertion is not always fatal to what follows it: whether a
        # test can go on is the test's call.
        - require-error

        # The floats compared are exact round trips: a tolerance would hide a
        # value that changed.
        - float-compare

        # A wire-format test pins exact bytes on purpose: assert.JSONEq would
        # accept the same document reordered or escaped differently.
        - encoded-compare

  exclusions:
    rules:

      # HTTP response writes where errors can't be meaningfully handled.
      - linters: [errcheck]
        text: "rw\\.Write|ResponseWriter\\.Write"

      # Deferred close calls where errors can't be meaningfully handled.
      - linters: [errcheck]
        text: "\\.Close`"

      # Fire-and-forget cache operations.
      - linters: [errcheck]
        text: "\\.Set`"

      # Middleware next handler calls in HTTP chains.
      - linters: [errcheck]
        source: "next\\("

      # Test files have relaxed error checking.
      - linters: [errcheck]
        path: "_test\\.go"

      # The `humanized` and `identifier` constants are a convention across all
      # integrations, even if not yet referenced in every package.
      - linters: [unused]
        text: "humanized"

      - linters: [unused]
        text: "identifier"

# Formatting is checked as part of `make lint`, so that an unformatted file fails
# CI rather than reaching review.
formatters:
  enable:
    - gofmt

    # gci checks the import blocks every file here is written with: the standard
    # library, then helix.go's own packages, then everything else.
    - gci
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/mountaya/helix.go)
        - default
      custom-order: true
