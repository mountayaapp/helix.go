openapi: 3.0.3
info:
  title: Things
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /things:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
      responses:
        "201":
          description: The thing was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
        "401":
          description: The caller is not authenticated.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
  /things/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: The thing.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
  /events:
    get:
      responses:
        "200":
          description: A stream of events.
          content:
            text/event-stream:
              schema:
                type: string
