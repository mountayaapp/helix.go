openapi: 3.0.3
info:
  title: Pages
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - HeaderKey: []
components:
  securitySchemes:
    HeaderKey:
      type: apiKey
      in: header
      name: X-Key
    QueryKey:
      type: apiKey
      in: query
      name: key
  responses:
    Refused:
      description: The request does not match the description.
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                minItems: 1
                items:
                  type: object
paths:
  /pages:
    parameters:
      - name: locale
        in: query
        required: false
        schema:
          type: string
    get:
      security:
        - HeaderKey: []
        - QueryKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/Refused"
  /pages/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/Refused"
